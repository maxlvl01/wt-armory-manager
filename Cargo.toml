[package]
name = "wt-armory-manager"
version = "0.1.0-alpha"
license = "MIT"
repository = "https://github.com/maxlvl01/wt-armory-manager"
edition = "2021"
description = "Browse live.warthunder.com and install or remove War Thunder user content with one click"

[[bin]]
name = "WTArmoryManager"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
